<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #18181b);
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        #status {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Device Verification</h2>
        <div id="status">⏳ Verifying device...</div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.ready();

        async function verifyUser() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('user_id');
            const botApi = urlParams.get('bot_api');

            if (!userId || !botApi) {
                document.getElementById("status").innerHTML = "❌ Missing parameters";
                return;
            }

            const deviceData = {
                user_id: userId,
                bot_api: botApi,
                user_agent: navigator.userAgent,
                screen_res: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language,
                platform: navigator.platform
            };

            try {
                // Calls the Netlify Serverless Function
                const response = await fetch('/.netlify/functions/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(deviceData)
                });

                const data = await response.json();

                if (data.status === "success") {
                    document.getElementById("status").innerHTML = "✅ Verification Successful!";
                    setTimeout(() => {
                        if (tg) tg.close();
                    }, 1500);
                } 
                else if (data.status === "info") {
                    document.getElementById("status").innerHTML = "✔️ Already Verified";
                    setTimeout(() => {
                        if (tg) tg.close();
                    }, 1500);
                } 
                else {
                    document.getElementById("status").innerHTML = "❌ " + (data.message || "Same Device Detected");
                }

            } catch (err) {
                console.error(err);
                document.getElementById("status").innerHTML = "❌ Network Error";
            }
        }

        window.onload = verifyUser;
    </script>
</body>
</html>
